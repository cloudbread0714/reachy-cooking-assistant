language: "ko-KR"
tone_instructions: "대학생 팀 프로젝트예요. 짧고 쉬운 한국어로 쓰고, 코멘트 앞에 [필수] [제안] [질문] 중 하나를 붙여주세요. [필수]는 버그, 데이터 약속 위반, 키 노출에만 써주세요."

reviews:
  profile: "chill"
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches:
      - "main"
  path_instructions:
    - path: "**/*.py"
      instructions: |
        - core/schema.py 의 함수 모양(listen, speak, ask, play, dispatch, 각 action 함수의 (params) -> ToolResult)을 바꾸면 [필수]로 알려주세요.
        - 감정/action 이름을 문자열로 직접 쓸 때 core/schema.py 의 EMOTIONS, ACTIONS 에 있는 이름인지 확인해주세요.
        - API 키나 비밀번호가 코드에 직접 들어가 있으면 [필수]로 알려주세요. 키는 core/config.py 를 통해 .env 에서 읽어야 해요.
        - 예외가 발생했을 때 대화 루프 전체가 멈출 수 있는 코드가 있으면 알려주세요.
    - path: "core/schema.py"
      instructions: |
        데이터 약속 파일이에요. 변경이 있으면 영향을 받는 모듈(voice, motion, vision, tools, main.py)을 요약해주고,
        docs/data-contract.md 도 같이 수정됐는지 확인해주세요.
    - path: "data/recipes/*.json"
      instructions: |
        레시피 형식(name, ingredients, optional, tags, time_min, steps)을 지켰는지 확인해주세요.
        steps 는 한 단계에 한 동작, 반말이어야 해요.
